name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"
      - "v*.*.*-*"
      - "*.*.*-*"

permissions:
  contents: write

# ============================================================
# Required GitHub Secrets
# ============================================================
#
# macOS:
#   MACOS_CERTIFICATE
#   MACOS_CERTIFICATE_PWD
#   MACOS_CI_KEYCHAIN_PWD
#
# Windows:
#   WINDOWS_CERTIFICATE
#   WINDOWS_CERTIFICATE_PWD
#
# Cloudflare:
#   CLOUDFLARE_DEPLOY_HOOK
#
# Cloudflare Pages：
#   CLOUDFLARE_DEPLOY_HOOK
#
# macOS 自签名证书切换为 Apple Developer ID 时：
#
#   需要替换：
#     MACOS_CERTIFICATE
#     MACOS_CERTIFICATE_PWD
#
#   同时检查：
#     APPLE_SIGNING_IDENTITY
#
#   当前 CI 使用：
#     ReadBriefSelfSign
#
#   切换 Developer ID 后应改为对应的：
#     Developer ID Application: ...
#
# ============================================================
# 同一时间只允许一个 Release workflow。
#
# latest.json / GitHub Release 都是全局版本资源。
# 如果两个 tag 同时发布，可能发生版本覆盖。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ============================================================
  # Create Release
  # ============================================================

  create-release:
    runs-on: ubuntu-22.04

    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.prerelease.outputs.prerelease }}

    steps:
      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ========================================================
      # Version
      # ========================================================

      - name: Compute version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          version="${ref#v}"

          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "Version: $version"

      - name: Verify version matches .version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          version="${ref#v}"

          file_version="$(tr -d '[:space:]' < .version)"

          case "$version" in
            *-test*)
              echo "Test release detected."
              echo "Skip .version consistency check."
              echo "Tag version: $version"
              ;;

            *)
              if [ "$version" != "$file_version" ]; then
                echo "::error::Tag version ($version) does not match .version ($file_version)."
                echo "::error::Please update .version before creating the tag."
                exit 1
              fi

              echo "Version matches: $version"
              ;;
          esac

      - name: Determine prerelease
        id: prerelease
        shell: bash
        run: |
          case "${{ steps.version.outputs.version }}" in
            *-test*|*-beta*|*-rc*|*-alpha*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # ========================================================
      # Release Notes
      # ========================================================

      - name: Generate release notes
        run: python3 .github/gen-release-notes.py

      # ========================================================
      # Create Draft Release
      # ========================================================

      - name: Create release
        id: create-release
        uses: actions/github-script@v8

        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

        with:
          script: |
            const fs = require('fs');

            const body = fs.readFileSync(
              'release-notes.md',
              'utf8'
            );

            // IMPORTANT:
            // github-script 的 context 对象没有直接提供 ref_name。
            //
            // 必须从 GitHub Actions 注入的环境变量读取：
            //
            //   process.env.GITHUB_REF_NAME
            //
            // 不要使用：
            //
            //   context.ref_name
            //
            // 否则 tag 可能变成 undefined，进而导致 GitHub API
            // 请求参数缺失并返回 422。

            const tag = process.env.GITHUB_REF_NAME;

            const isPrerelease =
              '${{ steps.prerelease.outputs.prerelease }}' === 'true';

            let existing = null;

            try {
              const { data } =
                await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag,
                });

              existing = data;
            } catch (e) {
              if (e.status !== 404) {
                throw e;
              }
            }

            if (existing) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.id,
              });

              console.log(
                `Deleted existing release: ${existing.id}`
              );
            }

            const { data } =
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,

                name:
                  `ReadBrief v${{ steps.version.outputs.version }}`,

                body,

                tag_name: tag,

                draft: true,

                prerelease: isPrerelease,
              });

            return data.id;

  # ============================================================
  # Build
  # ============================================================

  build:
    needs: create-release

    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # ----------------------------------------------------
          # macOS Intel
          # ----------------------------------------------------

          - os: macos-14
            target: x86_64-apple-darwin
            arch: x64

          # ----------------------------------------------------
          # macOS Apple Silicon
          # ----------------------------------------------------

          - os: macos-14
            target: aarch64-apple-darwin
            arch: aarch64

          # ----------------------------------------------------
          # Windows x64
          # ----------------------------------------------------

          - os: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v5

      # ========================================================
      # Rust
      # ========================================================

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

        with:
          targets: ${{ matrix.target }}

      # macOS 使用同一个 runner 构建 ARM64 和 Intel。
      #
      # 两个 target 必须都存在。

      - name: Add Rust targets (macOS cross-compile)
        if: runner.os == 'macOS'

        run: |
          rustup target add \
            x86_64-apple-darwin \
            aarch64-apple-darwin

      # ========================================================
      # Rust Cache
      # ========================================================
      #
      # 不再使用 Swatinem/rust-cache。
      #
      # 使用 GitHub 官方 actions/cache，并显式控制 cache key。
      #
      # 缓存：
      #
      #   ~/.cargo/registry
      #   ~/.cargo/git
      #   src-tauri/target
      #
      # key：
      #
      #   OS + Rust target + Cargo.lock hash
      #
      # 因此：
      #
      #   macOS ARM64
      #   macOS Intel
      #   Windows x64
      #
      # 三个平台不会共享 target。
      #
      # Cargo.lock 不变：
      #
      #   精确命中 cache
      #
      # Cargo.lock 变化：
      #
      #   使用 restore-keys 恢复旧 cache
      #   Cargo 自己判断哪些 crate 需要重新编译。
      #
      # 这样可以避免因为依赖发生变化而直接丢弃整个
      # target 缓存。

      - name: Rust cache
        uses: actions/cache@v4

        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target

          key: ${{ runner.os }}-${{ matrix.target }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}

          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-rust-

      # ========================================================
      # Node / npm
      # ========================================================
      #
      # setup-node 自带 npm cache。
      #
      # npm ci 使用 package-lock.json，保证 CI 安装结果稳定。

      - name: Setup Node
        uses: actions/setup-node@v5

        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # ========================================================
      # macOS Signing
      # ========================================================

      - name: Import Self-Signed Certificate
        if: runner.os == 'macOS'

        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.MACOS_CI_KEYCHAIN_PWD }}

        run: |
          echo "$MACOS_CERTIFICATE" |
            base64 --decode > certificate.p12

          security create-keychain \
            -p "$MACOS_CI_KEYCHAIN_PWD" \
            build.keychain

          security default-keychain \
            -s build.keychain

          security unlock-keychain \
            -p "$MACOS_CI_KEYCHAIN_PWD" \
            build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign \
            -s \
            -k "$MACOS_CI_KEYCHAIN_PWD" \
            build.keychain

      # ========================================================
      # Signing Identity
      # ========================================================

      # 当前使用自签名证书：
      #
      #   ReadBriefSelfSign
      #
      # 如果以后切换 Apple Developer ID：
      #
      #   1. 替换 MACOS_CERTIFICATE
      #   2. 替换 MACOS_CERTIFICATE_PWD
      #   3. 将下面 identity 改成：
      #
      #      Developer ID Application: ...
      #
      # 同时检查 GitHub Secrets 与 Tauri bundle 配置。

      - name: Configure Signing
        if: runner.os == 'macOS'

        run: |
          echo "APPLE_SIGNING_IDENTITY=ReadBriefSelfSign" \
            >> "$GITHUB_ENV"

      # ========================================================
      # Windows Signing
      # ========================================================

      - name: Import Code Signing Certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''

        shell: pwsh

        run: |
          $bytes = [System.Convert]::FromBase64String(
            $env:WINDOWS_CERTIFICATE
          )

          $pfx = Join-Path `
            $env:RUNNER_TEMP `
            "windows-cert.pfx"

          Set-Content `
            -Path $pfx `
            -Value $bytes `
            -AsByteStream

          $cert = New-Object `
            System.Security.Cryptography.X509Certificates.X509Certificate2(
              $pfx,
              $env:WINDOWS_CERTIFICATE_PWD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
            )

          $store = New-Object `
            System.Security.Cryptography.X509Certificates.X509Store(
              "My",
              "CurrentUser"
            )

          $store.Open(
            [System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite
          )

          $store.Add($cert)

          $store.Close()

          $thumb = $cert.Thumbprint

          python -c "
          import json

          p='src-tauri/tauri.conf.json'

          c=json.load(
              open(p,encoding='utf-8')
          )

          c.setdefault(
              'bundle',{}
          ).setdefault(
              'windows',{}
          )['certificateThumbprint']='$thumb'

          c['bundle']['windows']['timestampUrl'] = \
              'https://timestamp.digicert.com'

          json.dump(
              c,
              open(p,'w',encoding='utf-8'),
              ensure_ascii=False,
              indent=2
          )
          "

          echo "Windows signing certificate: $thumb"

      # ========================================================
      # Windows Build Dependencies
      # ========================================================

      - name: Install NSIS
        if: runner.os == 'Windows'

        run: |
          choco install nsis -y

      - name: Add MSVC build tools to PATH
        if: runner.os == 'Windows'

        uses: ilammy/msvc-dev-cmd@v1

      # ========================================================
      # Tauri Build
      # ========================================================

      - name: Build and upload (${{ matrix.arch }})
        uses: tauri-apps/tauri-action@v1

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

  # ============================================================
  # Publish Release
  # ============================================================

  publish-release:
    needs:
      - create-release
      - build

    runs-on: ubuntu-22.04

    steps:
      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v5

        with:
          fetch-depth: 0

      # ========================================================
      # Publish Release
      # ========================================================
      #
      # IMPORTANT:
      # 必须先 Publish，再 Collect Release Assets。
      #
      # Draft Release 在发布之前使用 GitHub 临时的
      # untagged-xxx URL。
      #
      # 发布后才会生成正式 tagged URL。
      #
      # 因此顺序必须保持：
      #
      #   publish release
      #       ↓
      #   collect release assets
      #       ↓
      #   generate latest.json
      #       ↓
      #   upload latest.json

      - name: Publish release
        uses: actions/github-script@v8

        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,

              release_id:
                ${{ needs.create-release.outputs.release_id }},

              draft: false
            });

      # ========================================================
      # Collect Release Assets
      # ========================================================
      #
      # IMPORTANT:
      # 不要根据版本号自行拼接下载 URL。
      #
      # ReadBrief 历史 tag 命名存在：
      #
      #   0.9.5
      #   v0.9.6
      #
      # 等不同形式。
      #
      # 因此必须从 GitHub Release API 获取真实的
      # browser_download_url。
      #
      # 否则自行拼接 URL 很容易因为 tag 格式不同产生 404。

      - name: Collect release assets
        id: assets

        uses: actions/github-script@v8

        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

        with:
          script: |
            // IMPORTANT:
            // 必须从环境变量获取 tag。
            //
            // github-script 的 context 没有 context.ref_name。

            const tag = process.env.GITHUB_REF_NAME;

            const { data: rel } =
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

            const { data } =
              await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner,
                repo: context.repo.repo,

                release_id: rel.id,

                per_page: 100,
              });

            const slim = data.map((a) => ({
              name: a.name,
              size: a.size,
              browser_download_url:
                a.browser_download_url,
            }));

            core.setOutput(
              'json',
              JSON.stringify(slim)
            );

            core.info(
              `Uploaded assets: ${slim.length}`
            );

            slim.forEach((a) => {
              core.info(
                `  ${a.name} (${a.size} bytes)`
              );
            });

      # ========================================================
      # Generate latest.json
      # ========================================================

      - name: Generate latest.json

        env:
          RB_ASSETS_JSON: ${{ steps.assets.outputs.json }}

        run: |
          python3 .github/gen-latest-json.py

      # ========================================================
      # Upload latest.json
      # ========================================================
      #
      # latest.json 必须以 Buffer 形式上传。
      #
      # 文件正文可能包含中文。
      #
      # JS string.length 计算的是 UTF-16 code unit 数量，
      # 而 HTTP Content-Length 需要的是 UTF-8 字节数。
      #
      # 因此必须使用：
      #
      #   fs.readFileSync('latest.json')
      #
      # 获取 Buffer 后再上传。

      - name: Upload latest.json
        uses: actions/github-script@v8

        with:
          script: |
            const fs = require('fs');

            const release_id =
              ${{ needs.create-release.outputs.release_id }};

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: existing } =
              await github.rest.repos.listReleaseAssets({
                owner,
                repo,
                release_id,
                per_page: 100,
              });

            for (
              const a of existing.filter(
                (a) => a.name === 'latest.json'
              )
            ) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: a.id,
              });

              core.info(
                `Deleted old latest.json: ${a.id}`
              );
            }

            // IMPORTANT:
            // 必须是 Buffer。

            const data =
              fs.readFileSync('latest.json');

            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,

              release_id,

              name: 'latest.json',

              data,

              headers: {
                'content-type':
                  'application/json',

                // Buffer.length 是 UTF-8 字节长度。
                'content-length':
                  data.length,
              },
            });

            core.info(
              `latest.json uploaded (${data.length} bytes)`
            );

      # ========================================================
      # Cloudflare Pages
      # ========================================================

      - name: Trigger docs site rebuild
        if: needs.create-release.outputs.prerelease == 'false'

        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}

        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::CLOUDFLARE_DEPLOY_HOOK is not configured."
            echo "Website will not be rebuilt automatically."
            exit 0
          fi

          code="$(
            curl -sS \
              -X POST \
              -o /dev/null \
              -w '%{http_code}' \
              "$HOOK"
          )"

          echo "Deploy hook response: HTTP $code"

          case "$code" in
            2*)
              echo "Website rebuild triggered."
              ;;

            *)
              echo "::error::Cloudflare deploy hook failed: HTTP $code"
              exit 1
              ;;
          esac
